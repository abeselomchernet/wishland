<svg width="1400" height="780" viewBox="0 0 1400 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="780" rx="36" fill="#F7F9FC"/>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061B35"/><stop offset="1" stop-color="#0A4167"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D4AF37"/><stop offset="1" stop-color="#F6D77A"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0A2A52" flood-opacity="0.12"/></filter>
  </defs>
  <text x="70" y="72" font-family="Segoe UI, Arial" font-size="18" font-weight="700" letter-spacing="3" fill="#007DBA">MARKET-DESIGN SHIFT</text>
  <text x="70" y="120" font-family="Segoe UI, Arial" font-size="36" font-weight="800" fill="#0A2A52">From duplicated rural channels to governed shared infrastructure</text>

  <rect x="70" y="170" width="535" height="520" rx="28" fill="#FFFFFF" stroke="#D8E2EC" filter="url(#shadow)"/>
  <text x="105" y="220" font-family="Segoe UI, Arial" font-size="16" font-weight="800" fill="#B5442E">FRAGMENTED MODEL</text>
  <text x="105" y="252" font-family="Segoe UI, Arial" font-size="24" font-weight="800" fill="#0A2A52">Each actor builds its own last-mile channel</text>
  <text x="105" y="282" font-family="Segoe UI, Arial" font-size="16" fill="#5D7087">Fixed costs repeat while rural transaction volume stays thin.</text>

  <g font-family="Segoe UI, Arial" font-size="15" font-weight="700" text-anchor="middle">
    <g><circle cx="155" cy="355" r="44" fill="#EAF2F8"/><text x="155" y="361" fill="#0A2A52">Bank A</text></g>
    <g><circle cx="285" cy="355" r="44" fill="#EAF2F8"/><text x="285" y="361" fill="#0A2A52">Bank B</text></g>
    <g><circle cx="415" cy="355" r="44" fill="#FFF6DE"/><text x="415" y="351" fill="#0A2A52">Mobile</text><text x="415" y="370" fill="#0A2A52">money</text></g>
    <g><circle cx="545" cy="355" r="44" fill="#F4ECF8"/><text x="545" y="351" fill="#0A2A52">Public</text><text x="545" y="370" fill="#0A2A52">program</text></g>
  </g>
  <g stroke="#AABBCB" stroke-width="2" stroke-dasharray="7 7">
    <path d="M155 400V485"/><path d="M285 400V485"/><path d="M415 400V485"/><path d="M545 400V485"/>
  </g>
  <g font-family="Segoe UI, Arial" font-size="13" font-weight="700" text-anchor="middle">
    <g><rect x="112" y="485" width="86" height="72" rx="16" fill="#FFF" stroke="#D8E2EC"/><text x="155" y="516" fill="#0A2A52">Agent</text><text x="155" y="538" fill="#9A5B4A">network</text></g>
    <g><rect x="242" y="485" width="86" height="72" rx="16" fill="#FFF" stroke="#D8E2EC"/><text x="285" y="516" fill="#0A2A52">Agent</text><text x="285" y="538" fill="#9A5B4A">network</text></g>
    <g><rect x="372" y="485" width="86" height="72" rx="16" fill="#FFF" stroke="#D8E2EC"/><text x="415" y="516" fill="#0A2A52">Agent</text><text x="415" y="538" fill="#9A5B4A">network</text></g>
    <g><rect x="502" y="485" width="86" height="72" rx="16" fill="#FFF" stroke="#D8E2EC"/><text x="545" y="516" fill="#0A2A52">Agent</text><text x="545" y="538" fill="#9A5B4A">network</text></g>
  </g>
  <rect x="105" y="600" width="465" height="54" rx="16" fill="#FFF1EE" stroke="#F1C9BF"/>
  <text x="337" y="632" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" font-weight="800" fill="#A6402D">Duplicated cost · fragmented liquidity · inconsistent service</text>

  <path d="M628 430H720" stroke="#D4AF37" stroke-width="5" stroke-linecap="round"/>
  <path d="M704 414L725 430L704 446" fill="none" stroke="#D4AF37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="750" y="170" width="580" height="520" rx="28" fill="url(#navy)" filter="url(#shadow)"/>
  <text x="790" y="220" font-family="Segoe UI, Arial" font-size="16" font-weight="800" fill="#F6D77A">SHARED MODEL</text>
  <text x="790" y="252" font-family="Segoe UI, Arial" font-size="24" font-weight="800" fill="#FFFFFF">Partners retain authority. Infrastructure is shared.</text>
  <text x="790" y="282" font-family="Segoe UI, Arial" font-size="16" fill="#C9DBE8">One governed operating layer composes authorized capabilities at rural Hubs.</text>

  <g font-family="Segoe UI, Arial" font-size="14" font-weight="700" text-anchor="middle">
    <g><circle cx="830" cy="350" r="40" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.22"/><text x="830" y="355" fill="#FFFFFF">Banks</text></g>
    <g><circle cx="930" cy="350" r="40" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.22"/><text x="930" y="346" fill="#FFFFFF">Mobile</text><text x="930" y="365" fill="#FFFFFF">money</text></g>
    <g><circle cx="1030" cy="350" r="40" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.22"/><text x="1030" y="346" fill="#FFFFFF">Public</text><text x="1030" y="365" fill="#FFFFFF">programs</text></g>
    <g><circle cx="1130" cy="350" r="40" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.22"/><text x="1130" y="346" fill="#FFFFFF">Commerce</text><text x="1130" y="365" fill="#FFFFFF">partners</text></g>
    <g><circle cx="1230" cy="350" r="40" fill="#FFFFFF" fill-opacity="0.11" stroke="#FFFFFF" stroke-opacity="0.22"/><text x="1230" y="346" fill="#FFFFFF">Other</text><text x="1230" y="365" fill="#FFFFFF">licensed</text></g>
  </g>
  <g stroke="#F6D77A" stroke-width="2" stroke-opacity="0.65"><path d="M830 391L930 452"/><path d="M930 391L975 452"/><path d="M1030 391L1030 452"/><path d="M1130 391L1085 452"/><path d="M1230 391L1130 452"/></g>

  <rect x="845" y="450" width="390" height="94" rx="22" fill="#FFFFFF"/>
  <text x="1040" y="483" text-anchor="middle" font-family="Segoe UI, Arial" font-size="14" font-weight="800" letter-spacing="2" fill="#007DBA">ENAWUGA SHARED OPERATING LAYER</text>
  <text x="1040" y="510" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="800" fill="#0A2A52">Service → Capability → Route → Adapter</text>
  <text x="1040" y="532" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#5D7087">Neutral rules · route provenance · evidence gates</text>

  <g stroke="#F6D77A" stroke-width="2" stroke-opacity="0.75"><path d="M945 545L895 595"/><path d="M1040 545V595"/><path d="M1135 545L1185 595"/></g>
  <g font-family="Segoe UI, Arial" text-anchor="middle">
    <g><rect x="815" y="595" width="160" height="66" rx="18" fill="#D4AF37"/><text x="895" y="624" font-size="14" font-weight="850" fill="#061B35">RURAL HUB</text><text x="895" y="645" font-size="12" fill="#0A2A52">multi-service node</text></g>
    <g><rect x="960" y="595" width="160" height="66" rx="18" fill="#F6D77A"/><text x="1040" y="624" font-size="14" font-weight="850" fill="#061B35">RURAL HUB</text><text x="1040" y="645" font-size="12" fill="#0A2A52">multi-service node</text></g>
    <g><rect x="1105" y="595" width="160" height="66" rx="18" fill="#D4AF37"/><text x="1185" y="624" font-size="14" font-weight="850" fill="#061B35">RURAL HUB</text><text x="1185" y="645" font-size="12" fill="#0A2A52">multi-service node</text></g>
  </g>
  <text x="1040" y="721" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#D7E7F3">Shared infrastructure does not transfer regulated authority to Wishland.</text>
</svg>